plugins {
    id 'com.android.application'
}

// The launcher activity/resources and native entry live in the project's native/
// (copied from the engine launcher templates at create time).
android {
    signingConfigs {
        release {
            if ('{{ANDROID_KEYSTORE_PATH}}' != '') {
                storeFile file('{{ANDROID_KEYSTORE_PATH}}')
                storePassword '{{ANDROID_STORE_PASSWORD}}'
                keyAlias '{{ANDROID_KEYSTORE_ALIAS}}'
                keyPassword '{{ANDROID_KEY_PASSWORD}}'
            }
        }
    }
    // namespace = the fixed Java package (create-time application id); applicationId
    // is the install id (may be overridden per preset).
    namespace '{{ANDROID_NAMESPACE}}'
    compileSdk {{COMPILE_SDK}}
    ndkVersion '{{NDK_VERSION}}'

    defaultConfig {
        applicationId '{{APPLICATION_ID}}'
        minSdk {{MIN_SDK}}
        targetSdk {{TARGET_SDK}}
        versionCode {{VERSION_CODE}}
        versionName '{{VERSION_NAME}}'
        externalNativeBuild {
            cmake {
                abiFilters '{{ANDROID_ABI}}'
                arguments "-D3RD_PATH=${System.getenv('SKY_3RD_PATH')}", '-DSKY_BUILD_EDITOR=OFF', '-DANDROID_TOOLCHAIN=clang', '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs = ['../../../native/android/java']
            res.srcDirs = ['../../../native/android/res']
        }
    }

    externalNativeBuild {
        cmake {
            // The project's independent CMake entry (three levels up from app/).
            path '../../../native/CMakeLists.txt'
        }
    }

    buildFeatures {
        prefab true
    }
    buildToolsVersion '34.0.0'
}

dependencies {
    implementation fileTree(include: ['*.so'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.games:games-activity:1.1.0'
}
