schema: spec-driven

rules:
  proposal:
    - Use the canonical domain capability IDs in openspec/README.md and openspec/capability-map.json; explain any genuinely new domain.
    - Keep one current implementation or acceptance owner; distinguish delivered work, remaining validation, planned work and historical evidence.
  specs:
    - Extend the existing domain spec rather than recreating historical leaf-capability directories. Preserve requirement identity and update active delta paths and references together.
    - Historical archive snapshots retain their original IDs; use openspec/capability-map.json to resolve them. Do not replay old deltas over a newer contract without a sync review.
